<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="600" height="600" viewBox="0 0 600 600" aria-labelledby="title desc" role="img">
  <title>Layer Chicken Eggs</title>
  <desc>Simple illustration of a layer chicken egg in white with highlights.</desc>
  <rect width="100%" height="100%" fill="transparent"/>
  <!-- shadow -->
  <ellipse cx="300" cy="420" rx="170" ry="40" fill="#000" opacity="0.08" />
  <!-- egg body -->
  <g transform="translate(0,-20)">
    <path d="M300 140 C360 140 420 220 420 300 C420 380 360 460 300 460 C240 460 180 380 180 300 C180 220 240 140 300 140 Z" fill="#FFF8F0" stroke="#EDE7E0" stroke-width="4" />
    <!-- highlight -->
    <path d="M340 200 C360 220 360 260 340 290 C320 320 290 320 280 300 C270 280 280 240 300 220 C320 200 330 200 340 200 Z" fill="#FFFFFF" opacity="0.7" />
    <!-- subtle pattern -->
    <g fill="#F4F1EE" opacity="0.6">
      <ellipse cx="260" cy="260" rx="12" ry="18" />
      <ellipse cx="320" cy="320" rx="8" ry="12" />
      <ellipse cx="220" cy="320" rx="6" ry="9" />
    </g>
  </g>
  <!-- label -->
  <rect x="0" y="0" width="100%" height="60" fill="none" />
  <text x="50%" y="560" font-family="Arial, Helvetica, sans-serif" font-size="28" fill="#2F855A" text-anchor="middle">Layer Chicken Eggs</text>
</svg>