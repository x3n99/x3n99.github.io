<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="600" height="600" viewBox="0 0 600 600" aria-labelledby="title desc" role="img">
  <title>Omega-3 Eggs</title>
  <desc>Illustration of a golden-yellow egg representing omega-3, with a small leaf icon.</desc>
  <rect width="100%" height="100%" fill="transparent"/>
  <!-- shadow -->
  <ellipse cx="300" cy="420" rx="170" ry="40" fill="#000" opacity="0.08" />
  <!-- egg body golden -->
  <g transform="translate(0,-20)">
    <path d="M300 140 C360 140 420 220 420 300 C420 380 360 460 300 460 C240 460 180 380 180 300 C180 220 240 140 300 140 Z" fill="#FFF1D6" stroke="#F3D9A5" stroke-width="4" />
    <!-- highlight -->
    <path d="M340 200 C360 220 360 260 340 290 C320 320 290 320 280 300 C270 280 280 240 300 220 C320 200 330 200 340 200 Z" fill="#FFF9E6" opacity="0.85" />
    <!-- omega badge -->
    <g transform="translate(360,320)">
      <circle cx="0" cy="0" r="36" fill="#F6AD55" stroke="#DD6B20" stroke-width="3" />
      <path d="M-10 -2 C-6 6 6 6 10 -2" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" />
      <text x="0" y="11" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#FFFFFF" text-anchor="middle">ω-3</text>
    </g>
    <!-- leaf icon -->
    <path d="M230 260 C255 240 280 245 300 265" stroke="#2F855A" stroke-width="6" fill="none" stroke-linecap="round" opacity="0.9" />
  </g>
  <text x="50%" y="560" font-family="Arial, Helvetica, sans-serif" font-size="28" fill="#B7791F" text-anchor="middle">Omega-3 Eggs</text>
</svg>