<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="600" height="600" viewBox="0 0 600 600" aria-labelledby="title desc" role="img">
  <title>Free-range Eggs</title>
  <desc>Illustration of a brown free-range egg with textured spots to represent natural eggs.</desc>
  <rect width="100%" height="100%" fill="transparent"/>
  <!-- shadow -->
  <ellipse cx="300" cy="420" rx="170" ry="40" fill="#000" opacity="0.08" />
  <!-- egg body brown -->
  <g transform="translate(0,-20)">
    <path d="M300 140 C360 140 420 220 420 300 C420 380 360 460 300 460 C240 460 180 380 180 300 C180 220 240 140 300 140 Z" fill="#E8C5A1" stroke="#C99A6B" stroke-width="4" />
    <!-- spots -->
    <g fill="#C28A60" opacity="0.9">
      <ellipse cx="260" cy="260" rx="10" ry="7"/>
      <ellipse cx="295" cy="310" rx="7" ry="5"/>
      <ellipse cx="235" cy="320" rx="6" ry="4"/>
      <ellipse cx="325" cy="250" rx="8" ry="6"/>
    </g>
    <!-- highlight -->
    <path d="M340 200 C360 220 360 260 340 290 C320 320 290 320 280 300 C270 280 280 240 300 220 C320 200 330 200 340 200 Z" fill="#FFFFFF" opacity="0.6" />
  </g>
  <text x="50%" y="560" font-family="Arial, Helvetica, sans-serif" font-size="28" fill="#974A16" text-anchor="middle">Free-range Eggs</text>
</svg>